<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phonics Audio Player | Kokoro TTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --secondary: #06b6d4;
      --accent: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --surface: rgba(15, 23, 42, 0.8);
      --surface-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.75rem 1rem env(safe-area-inset-bottom, 0.75rem);
      overflow-x: hidden;
    }

    /* Ultra-compact top navigation header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 0.75rem;
      padding: 0 0.25rem;
    }

    .brand-title {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #fff;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }

    .brand-sub {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    /* Player Container */
    .player-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: center;
      gap: 0.75rem;
    }

    /* Inline Selectors Row */
    .selectors-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 0.5rem;
      width: 100%;
    }

    .select-box {
      position: relative;
    }

    .custom-select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .custom-select-trigger:active, .custom-select-trigger.active {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .custom-select-trigger .arrow {
      font-size: 0.6rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .custom-select-trigger.active .arrow {
      transform: rotate(180deg);
    }

    /* Custom Dropdown Menus */
    .custom-options {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      max-height: 230px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.7);
      display: none;
      padding: 0.3rem;
    }

    .custom-options.show {
      display: block;
    }

    .custom-option {
      padding: 0.55rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      color: #cbd5e1;
    }

    .custom-option:hover, .custom-option:active {
      background: rgba(99, 102, 241, 0.25);
      color: #fff;
    }

    .custom-option.selected {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    /* The Main Showcase Deck */
    .deck-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.25rem 1.15rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 16px 32px -10px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Compact Letter & Phonetic Row */
    .letter-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }

    .letter-display {
      width: 3.75rem;
      height: 3.75rem;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
      user-select: none;
    }

    .letter-info {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .phonetic-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--secondary);
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.25);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }

    .meta-pills {
      display: flex;
      gap: 0.35rem;
    }

    .meta-pill {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: #94a3b8;
    }

    .grade-badge-glow {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    /* Word Title */
    .word-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      margin: 0.2rem 0 0.5rem;
    }

    /* Sentence Card */
    .sentence-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: 3px solid var(--secondary);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.85rem;
      text-align: left;
    }

    .sentence-card-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--secondary);
      margin-bottom: 0.25rem;
    }

    .sentence-card-text {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.45;
      color: #f1f5f9;
      font-style: italic;
    }

    /* Visualizer Bar */
    .waveform-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 18px;
      margin-bottom: 0.75rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .waveform-bar.active {
      opacity: 1;
    }

    .wave-stick {
      width: 3px;
      background: var(--primary);
      border-radius: 3px;
      animation: wavePulse 0.9s ease-in-out infinite;
    }

    .wave-stick:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .wave-stick:nth-child(2) { height: 12px; animation-delay: 0.25s; }
    .wave-stick:nth-child(3) { height: 18px; animation-delay: 0.4s; }
    .wave-stick:nth-child(4) { height: 10px; animation-delay: 0.15s; }
    .wave-stick:nth-child(5) { height: 16px; animation-delay: 0.3s; }
    .wave-stick:nth-child(6) { height: 8px; animation-delay: 0.2s; }
    .wave-stick:nth-child(7) { height: 14px; animation-delay: 0.35s; }

    @keyframes wavePulse {
      0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    /* Action Buttons (Large Touch Target for Mobile) */
    .player-controls {
      display: flex;
      gap: 0.6rem;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      min-height: 48px;
      padding: 0.65rem 0.5rem;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .action-btn.btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
      border-color: transparent;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .action-btn.playing {
      background: linear-gradient(135deg, var(--accent) 0%, #e11d48 100%) !important;
      border-color: transparent;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.5);
    }

    /* Swipe / Touch Navigation Bar */
    .deck-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 0.6rem;
      padding: 0 0.25rem;
    }

    .nav-arrow-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      min-height: 38px;
    }

    .nav-arrow-btn:active:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-arrow-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .index-indicator {
      font-size: 0.78rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    /* Minimal footer */
    footer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-dim);
      padding: 0.5rem 0 0;
    }

    footer a {
      color: #a5b4fc;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Minimal Top Header -->
  <header class="top-bar">
    <div class="brand-title">
      <span class="brand-dot"></span>
      <span>Phonics Player</span>
    </div>
    <span class="brand-sub">Kokoro-82M TTS</span>
  </header>

  <!-- Main Mobile App Layout -->
  <main class="player-container">

    <!-- Compact Dropdowns Row -->
    <div class="selectors-row">
      <!-- Letter Select -->
      <div class="select-box" id="letter-select-box">
        <div class="custom-select-trigger" id="letter-trigger">
          <span id="selected-letter-label">A</span>
          <span class="arrow">▼</span>
        </div>
        <div class="custom-options" id="letter-options"></div>
      </div>

      <!-- Grade Select -->
      <div class="select-box" id="grade-select-box">
        <div class="custom-select-trigger" id="grade-trigger">
          <span id="selected-grade-label">Pre-K</span>
          <span class="arrow">▼</span>
        </div>
        <div class="custom-options" id="grade-options"></div>
      </div>
    </div>

    <!-- The Single Player Deck Card -->
    <section class="deck-card" id="deck-card">

      <!-- Compact Letter & Metadata Header -->
      <div class="letter-row">
        <div class="letter-display" id="deck-letter">A</div>
        <div class="letter-info">
          <div class="phonetic-tag" id="deck-phonetic">/eɪ/ or /æ/</div>
          <div class="meta-pills">
            <span class="meta-pill" id="deck-pos">Noun</span>
            <span class="meta-pill grade-badge-glow" id="deck-grade">Pre-K</span>
          </div>
        </div>
      </div>

      <!-- Word Title -->
      <div class="word-title" id="deck-word">Ant</div>

      <!-- Contextual Sentence Box -->
      <div class="sentence-card">
        <div class="sentence-card-label">Sentence</div>
        <div class="sentence-card-text" id="deck-sentence">"A tiny ant crawls on the leaf."</div>
      </div>

      <!-- Waveform Animation -->
      <div class="waveform-bar" id="waveform">
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
      </div>

      <!-- Playback Actions (Min 48px touch targets) -->
      <div class="player-controls">
        <button class="action-btn btn-primary" id="play-word-btn" onclick="playCurrentWord()">
          <span id="word-btn-icon">▶</span>
          <span id="word-btn-label">Word</span>
        </button>
        <button class="action-btn" id="play-sentence-btn" onclick="playCurrentSentence()">
          <span id="sent-btn-icon">▶</span>
          <span id="sent-btn-label">Sentence</span>
        </button>
      </div>

      <!-- Bottom Nav Arrow Controls -->
      <div class="deck-nav-bar">
        <button class="nav-arrow-btn" id="prev-btn" onclick="navAlphabet(-1)">
          <span>←</span> Prev
        </button>
        <span class="index-indicator" id="index-indicator">1 of 26</span>
        <button class="nav-arrow-btn" id="next-btn" onclick="navAlphabet(1)">
          Next <span>→</span>
        </button>
      </div>
    </section>

  </main>

  <footer>
    <p>Powered by <a href="https://github.com/hexgrad/kokoro" target="_blank">Kokoro TTS</a> | Open Phonics Corpus</p>
  </footer>

  <script>
    const GRADES = [
      { id: "Pre-K", label: "Pre-K (Ages 3-4)" },
      { id: "Kindergarten", label: "Kindergarten (Ages 5-6)" },
      { id: "Grade 1", label: "Grade 1 (Ages 6-7)" },
      { id: "Grade 2", label: "Grade 2 (Ages 7-8)" },
      { id: "Grade 3", label: "Grade 3 (Ages 8-9)" },
      { id: "Grade 4", label: "Grade 4 (Ages 9-10)" },
      { id: "Grade 5", label: "Grade 5 (Ages 10-11)" }
    ];

    let corpusData = [];
    let currentLetterIndex = 0;
    let selectedGradeId = "Pre-K";
    let currentAudio = null;
    let activePlayingType = null;

    async function init() {
      try {
        const resp = await fetch('data/corpus.json');
        corpusData = await resp.json();
        setupDropdowns();
        setupGestures();
        updateDeck();
      } catch (e) {
        console.error("Failed to load corpus data:", e);
      }
    }

    function setupDropdowns() {
      // 1. Letters Dropdown
      const letterOpts = document.getElementById('letter-options');
      letterOpts.innerHTML = '';
      corpusData.forEach((item, idx) => {
        const opt = document.createElement('div');
        opt.className = `custom-option ${idx === currentLetterIndex ? 'selected' : ''}`;
        opt.dataset.index = idx;
        opt.textContent = `${item.letter} — ${item.words[0]?.word || ''}`;
        opt.onclick = () => {
          currentLetterIndex = idx;
          document.getElementById('selected-letter-label').textContent = item.letter;
          closeAllDropdowns();
          updateDeck();
          highlightSelectedOption('letter-options', idx);
        };
        letterOpts.appendChild(opt);
      });

      // 2. Grades Dropdown
      const gradeOpts = document.getElementById('grade-options');
      gradeOpts.innerHTML = '';
      GRADES.forEach(g => {
        const opt = document.createElement('div');
        opt.className = `custom-option ${g.id === selectedGradeId ? 'selected' : ''}`;
        opt.dataset.grade = g.id;
        opt.textContent = g.label;
        opt.onclick = () => {
          selectedGradeId = g.id;
          document.getElementById('selected-grade-label').textContent = g.id;
          closeAllDropdowns();
          updateDeck();
          highlightSelectedOption('grade-options', g.id);
        };
        gradeOpts.appendChild(opt);
      });

      // Trigger buttons
      const letterTrigger = document.getElementById('letter-trigger');
      const gradeTrigger = document.getElementById('grade-trigger');

      letterTrigger.onclick = (e) => {
        e.stopPropagation();
        const isOpen = letterOpts.classList.contains('show');
        closeAllDropdowns();
        if (!isOpen) {
          letterOpts.classList.add('show');
          letterTrigger.classList.add('active');
        }
      };

      gradeTrigger.onclick = (e) => {
        e.stopPropagation();
        const isOpen = gradeOpts.classList.contains('show');
        closeAllDropdowns();
        if (!isOpen) {
          gradeOpts.classList.add('show');
          gradeTrigger.classList.add('active');
        }
      };

      document.addEventListener('click', closeAllDropdowns);
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.custom-options').forEach(o => o.classList.remove('show'));
      document.querySelectorAll('.custom-select-trigger').forEach(t => t.classList.remove('active'));
    }

    function highlightSelectedOption(containerId, value) {
      const container = document.getElementById(containerId);
      container.querySelectorAll('.custom-option').forEach(opt => {
        if (opt.dataset.index == value || opt.dataset.grade == value) {
          opt.classList.add('selected');
        } else {
          opt.classList.remove('selected');
        }
      });
    }

    function getCurrentEntry() {
      if (!corpusData.length) return null;
      const letterData = corpusData[currentLetterIndex];
      if (!letterData) return null;

      let wordEntry = (letterData.words || []).find(w => w.grade === selectedGradeId);
      if (!wordEntry && letterData.words.length) {
        wordEntry = letterData.words[0];
      }

      return {
        letter: letterData.letter,
        phonetic: letterData.phonetic_hint || '',
        word: wordEntry ? wordEntry.word : '',
        pos: wordEntry ? (wordEntry.part_of_speech || 'noun') : '',
        grade: wordEntry ? wordEntry.grade : selectedGradeId,
        wordAudio: wordEntry ? wordEntry.audio_path : '',
        sentence: wordEntry?.sentences?.[0]?.sentence || '',
        sentAudio: wordEntry?.sentences?.[0]?.audio_path || ''
      };
    }

    function updateDeck() {
      stopAudio();
      const entry = getCurrentEntry();
      if (!entry) return;

      document.getElementById('deck-letter').textContent = entry.letter;
      document.getElementById('selected-letter-label').textContent = entry.letter;
      document.getElementById('deck-phonetic').textContent = entry.phonetic;
      document.getElementById('deck-word').textContent = entry.word;
      document.getElementById('deck-pos').textContent = entry.pos;
      document.getElementById('deck-grade').textContent = entry.grade;
      document.getElementById('selected-grade-label').textContent = entry.grade;
      document.getElementById('deck-sentence').textContent = `"${entry.sentence}"`;

      document.getElementById('index-indicator').textContent = `${currentLetterIndex + 1} of ${corpusData.length}`;
      document.getElementById('prev-btn').disabled = (currentLetterIndex === 0);
      document.getElementById('next-btn').disabled = (currentLetterIndex === corpusData.length - 1);

      highlightSelectedOption('letter-options', currentLetterIndex);
      highlightSelectedOption('grade-options', selectedGradeId);
    }

    function navAlphabet(delta) {
      const newIdx = currentLetterIndex + delta;
      if (newIdx >= 0 && newIdx < corpusData.length) {
        currentLetterIndex = newIdx;
        updateDeck();
      }
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      activePlayingType = null;
      document.getElementById('waveform').classList.remove('active');

      const wordBtn = document.getElementById('play-word-btn');
      wordBtn.classList.remove('playing');
      document.getElementById('word-btn-icon').textContent = '▶';
      document.getElementById('word-btn-label').textContent = 'Word';

      const sentBtn = document.getElementById('play-sentence-btn');
      sentBtn.classList.remove('playing');
      document.getElementById('sent-btn-icon').textContent = '▶';
      document.getElementById('sent-btn-label').textContent = 'Sentence';
    }

    function playAudio(path, type) {
      if (activePlayingType === type && currentAudio && !currentAudio.paused) {
        stopAudio();
        return;
      }

      stopAudio();

      activePlayingType = type;
      currentAudio = new Audio(path);
      document.getElementById('waveform').classList.add('active');

      if (type === 'word') {
        const btn = document.getElementById('play-word-btn');
        btn.classList.add('playing');
        document.getElementById('word-btn-icon').textContent = '⏹';
        document.getElementById('word-btn-label').textContent = 'Stop';
      } else {
        const btn = document.getElementById('play-sentence-btn');
        btn.classList.add('playing');
        document.getElementById('sent-btn-icon').textContent = '⏹';
        document.getElementById('sent-btn-label').textContent = 'Stop';
      }

      currentAudio.play().catch(e => {
        console.error("Audio error:", e);
        stopAudio();
      });

      currentAudio.onended = () => {
        stopAudio();
      };
    }

    function playCurrentWord() {
      const entry = getCurrentEntry();
      if (entry?.wordAudio) playAudio(entry.wordAudio, 'word');
    }

    function playCurrentSentence() {
      const entry = getCurrentEntry();
      if (entry?.sentAudio) playAudio(entry.sentAudio, 'sentence');
    }

    // Swipe Gesture Support for Mobile
    function setupGestures() {
      const card = document.getElementById('deck-card');
      let touchStartX = 0;
      let touchEndX = 0;

      card.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        const swipeDistance = touchEndX - touchStartX;
        if (Math.abs(swipeDistance) > 45) {
          if (swipeDistance < 0) {
            navAlphabet(1); // Swipe Left -> Next
          } else {
            navAlphabet(-1); // Swipe Right -> Prev
          }
        }
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') navAlphabet(-1);
      else if (e.key === 'ArrowRight') navAlphabet(1);
      else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        playCurrentWord();
      }
    });

    init();
  </script>
</body>
</html>
