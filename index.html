<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alphabet Phonics & Sentences Explorer (Kokoro TTS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(30, 41, 69, 0.95);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #06b6d4;
      --accent: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    /* Quick Filter Alphabet Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem;
      padding: 1rem 1.5rem;
      max-width: 1100px;
      margin: 0 auto 1.5rem;
    }

    .alpha-btn {
      width: 2.25rem;
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .alpha-btn:hover, .alpha-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .letter-badge {
      width: 3rem;
      height: 3rem;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .phonetic {
      font-size: 0.85rem;
      color: var(--secondary);
      font-family: monospace;
      background: rgba(6, 182, 212, 0.1);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .word-section {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .word-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .word-text {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
    }

    .sentence-section {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
      padding: 0.85rem;
      border-left: 3px solid var(--secondary);
      margin-top: 0.5rem;
    }

    .sentence-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
      margin-bottom: 0.65rem;
      font-style: italic;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .play-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .play-btn.playing {
      background: var(--accent);
      border-color: var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    footer a {
      color: #a5b4fc;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="badge">Kokoro TTS Corpus & Player</div>
    <h1>Alphabet A to Z Explorer</h1>
    <p class="subtitle">
      High-quality neural speech dataset generated with Kokoro-82M. Explore pronunciation for every letter, word, and example sentence.
    </p>
  </header>

  <nav class="filter-bar" id="alpha-filter">
    <button class="alpha-btn active" data-letter="ALL">ALL</button>
  </nav>

  <main>
    <div class="cards-grid" id="grid">
      <!-- Cards rendered via JS -->
    </div>
  </main>

  <footer>
    <p>Powered by <a href="https://github.com/hexgrad/kokoro" target="_blank">Kokoro TTS</a> | Open Source Phonics Dataset</p>
  </footer>

  <script>
    let currentAudio = null;
    let activeBtn = null;
    let corpusData = [];

    async function loadCorpus() {
      try {
        const response = await fetch('data/corpus.json');
        corpusData = await response.json();
        buildFilterBar();
        renderCards('ALL');
      } catch (err) {
        console.error("Failed to load corpus.json:", err);
        document.getElementById('grid').innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #f87171;">
            Failed to load dataset: ${err.message}
          </div>
        `;
      }
    }

    function buildFilterBar() {
      const filterBar = document.getElementById('alpha-filter');
      corpusData.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'alpha-btn';
        btn.dataset.letter = item.letter;
        btn.textContent = item.letter;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCards(item.letter);
        });
        filterBar.appendChild(btn);
      });

      document.querySelector('.alpha-btn[data-letter="ALL"]').addEventListener('click', (e) => {
        document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderCards('ALL');
      });
    }

    function playAudio(path, btn) {
      if (currentAudio) {
        currentAudio.pause();
        if (activeBtn) {
          activeBtn.classList.remove('playing');
          activeBtn.innerHTML = activeBtn.dataset.originalHtml;
        }
      }

      if (btn === activeBtn && !currentAudio.paused) {
        currentAudio = null;
        activeBtn = null;
        return;
      }

      const audio = new Audio(path);
      currentAudio = audio;
      activeBtn = btn;
      btn.dataset.originalHtml = btn.innerHTML;
      btn.classList.add('playing');
      btn.innerHTML = `<span>⏹ Stop</span>`;

      audio.play().catch(e => {
        console.error("Audio playback error:", e);
        btn.classList.remove('playing');
        btn.innerHTML = btn.dataset.originalHtml;
        alert("Audio file not yet generated or could not be loaded: " + path);
      });

      audio.onended = () => {
        btn.classList.remove('playing');
        btn.innerHTML = btn.dataset.originalHtml;
        currentAudio = null;
        activeBtn = null;
      };
    }

    function renderCards(filterLetter) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const filtered = filterLetter === 'ALL' 
        ? corpusData 
        : corpusData.filter(d => d.letter === filterLetter);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${item.letter}`;

        let wordsHtml = '';
        (item.words || []).forEach(w => {
          let sentencesHtml = '';
          (w.sentences || []).forEach(s => {
            sentencesHtml += `
              <div class="sentence-section">
                <div class="sentence-text">"${s.sentence}"</div>
                <button class="play-btn" onclick="playAudio('${s.audio_path}', this)">
                  <span>▶ Play Sentence</span>
                </button>
              </div>
            `;
          });

          wordsHtml += `
            <div class="word-section">
              <div class="word-title-row">
                <div class="word-text">${w.word}</div>
                <button class="play-btn" onclick="playAudio('${w.audio_path}', this)">
                  <span>▶ Play Word</span>
                </button>
              </div>
              ${sentencesHtml}
            </div>
          `;
        });

        card.innerHTML = `
          <div class="card-header">
            <div class="letter-badge">${item.letter}</div>
            <div class="phonetic">${item.phonetic_hint || ''}</div>
          </div>
          ${wordsHtml}
        `;
        grid.appendChild(card);
      });
    }

    loadCorpus();
  </script>
</body>
</html>
