<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phonics Fun! 🌟 Alphabet Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #4f46e5;
      --bg-gradient: linear-gradient(180deg, #6366f1 0%, #4338ca 40%, #312e81 100%);
      --card-bg: #ffffff;
      --card-shadow: 0 16px 36px rgba(15, 23, 42, 0.28), 0 6px 0 #312e81;
      --yellow: #facc15;
      --yellow-shadow: #ca8a04;
      --orange: #fb923c;
      --pink: #f43f5e;
      --pink-shadow: #be123c;
      --cyan: #06b6d4;
      --cyan-shadow: #0e7490;
      --green: #10b981;
      --green-shadow: #047857;
      --purple: #8b5cf6;
      --text-dark: #1e1b4b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: var(--bg-gradient);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.75rem 1rem env(safe-area-inset-bottom, 0.75rem);
      overflow-x: hidden;
      color: var(--text-dark);
    }

    /* Floating background shapes for extra playful look */
    .bubble {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
      background: #ffffff;
      animation: floatBubble 8s ease-in-out infinite alternate;
    }
    .b1 { width: 140px; height: 140px; top: -30px; left: -30px; }
    .b2 { width: 180px; height: 180px; bottom: 40px; right: -40px; animation-duration: 11s; }
    .b3 { width: 90px; height: 90px; top: 35%; right: 10px; animation-duration: 7s; }

    @keyframes floatBubble {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.06); }
    }

    /* Ultra-compact top bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      margin: 0 auto 0.5rem;
      padding: 0 0.25rem;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .brand-badge {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: #1e1b4b;
      background: var(--yellow);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      box-shadow: 0 2px 0 var(--yellow-shadow);
    }

    /* Player Container */
    .player-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: center;
      gap: 0.65rem;
    }

    /* Stylized Dropdowns Row */
    .selectors-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 0.55rem;
      width: 100%;
    }

    .select-box {
      position: relative;
    }

    .custom-select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.95rem;
      background: #ffffff;
      border: 3px solid #e0e7ff;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      box-shadow: 0 4px 0 #c7d2fe;
      transition: all 0.15s ease;
    }

    .custom-select-trigger:active, .custom-select-trigger.active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #c7d2fe;
      border-color: var(--purple);
    }

    .custom-select-trigger .arrow {
      font-size: 0.75rem;
      color: var(--purple);
      transition: transform 0.2s;
    }

    .custom-select-trigger.active .arrow {
      transform: rotate(180deg);
    }

    /* Options Popup Menu */
    .custom-options {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 3px solid #c7d2fe;
      border-radius: 18px;
      max-height: 230px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.25);
      display: none;
      padding: 0.4rem;
    }

    .custom-options.show {
      display: block;
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .custom-option {
      padding: 0.6rem 0.85rem;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      color: #334155;
      transition: all 0.12s;
      margin-bottom: 2px;
    }

    .custom-option:hover, .custom-option:active {
      background: #eef2ff;
      color: var(--primary);
    }

    .custom-option.selected {
      background: var(--yellow);
      color: #713f12;
      font-weight: 700;
    }

    /* The Main Bouncy Deck Card */
    .deck-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 1.35rem 1.25rem 1.15rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: var(--card-shadow);
      border: 4px solid #ffffff;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Top Letter & Metadata Row */
    .letter-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 0.65rem;
      width: 100%;
      justify-content: center;
    }

    .letter-display {
      width: 4.4rem;
      height: 4.4rem;
      border-radius: 22px;
      background: linear-gradient(135deg, #f43f5e 0%, #fb923c 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.75rem;
      font-weight: 700;
      box-shadow: 0 6px 0 #be123c, 0 10px 18px rgba(244, 63, 94, 0.35);
      border: 3px solid #ffe4e6;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .letter-display:active {
      transform: scale(0.92) rotate(-4deg);
    }

    .letter-info {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .phonetic-tag {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #0369a1;
      background: #e0f2fe;
      border: 2px solid #bae6fd;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      display: inline-block;
      width: fit-content;
    }

    .meta-pills {
      display: flex;
      gap: 0.4rem;
    }

    .meta-pill {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 8px;
      background: #f1f5f9;
      color: #475569;
    }

    .grade-badge-glow {
      background: #fef08a;
      color: #854d0e;
      border: 1px solid #fde047;
    }

    /* Word Title */
    .word-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.01em;
      margin: 0.1rem 0 0.6rem;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .word-title:active {
      transform: scale(0.96);
    }

    /* Sentence Card */
    .sentence-card {
      width: 100%;
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-left: 6px solid #10b981;
      border-radius: 16px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.95rem;
      text-align: left;
      box-shadow: 0 3px 0 #cbd5e1;
    }

    .sentence-card-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #059669;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .sentence-card-text {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.45;
      color: #1e293b;
    }

    /* Waveform Animation */
    .waveform-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 22px;
      margin-bottom: 0.85rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .waveform-bar.active {
      opacity: 1;
    }

    .wave-stick {
      width: 5px;
      background: #f43f5e;
      border-radius: 4px;
      animation: wavePulse 0.8s ease-in-out infinite;
    }

    .wave-stick:nth-child(1) { height: 8px; animation-delay: 0.1s; background: #fb923c; }
    .wave-stick:nth-child(2) { height: 16px; animation-delay: 0.25s; background: #facc15; }
    .wave-stick:nth-child(3) { height: 22px; animation-delay: 0.4s; background: #10b981; }
    .wave-stick:nth-child(4) { height: 14px; animation-delay: 0.15s; background: #06b6d4; }
    .wave-stick:nth-child(5) { height: 20px; animation-delay: 0.3s; background: #6366f1; }
    .wave-stick:nth-child(6) { height: 10px; animation-delay: 0.2s; background: #8b5cf6; }
    .wave-stick:nth-child(7) { height: 18px; animation-delay: 0.35s; background: #f43f5e; }

    @keyframes wavePulse {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }

    /* Big Chunky 3D Popping Buttons */
    .player-controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      min-height: 52px;
      padding: 0.75rem 0.6rem;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    /* Yellow/Orange 3D Pop Button for Word */
    .btn-word {
      background: #facc15;
      color: #713f12;
      box-shadow: 0 5px 0 #ca8a04, 0 8px 16px rgba(250, 204, 21, 0.4);
    }

    .btn-word:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #ca8a04;
    }

    /* Cyan/Blue 3D Pop Button for Sentence */
    .btn-sent {
      background: #06b6d4;
      color: #ffffff;
      box-shadow: 0 5px 0 #0891b2, 0 8px 16px rgba(6, 182, 212, 0.4);
    }

    .btn-sent:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0891b2;
    }

    /* Pulsing Red State when playing */
    .action-btn.playing {
      background: #f43f5e !important;
      color: #ffffff !important;
      box-shadow: 0 5px 0 #be123c, 0 0 20px rgba(244, 63, 94, 0.6) !important;
      animation: pulsePlay 1.2s infinite;
    }

    @keyframes pulsePlay {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* Nav Arrow Controls */
    .deck-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 0.75rem;
      padding: 0 0.15rem;
    }

    .nav-arrow-btn {
      background: #f1f5f9;
      border: none;
      color: var(--text-dark);
      border-radius: 14px;
      padding: 0.45rem 1rem;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 40px;
      box-shadow: 0 3px 0 #cbd5e1;
      transition: all 0.1s ease;
    }

    .nav-arrow-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 0 0 #cbd5e1;
    }

    .nav-arrow-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .index-indicator {
      font-size: 0.88rem;
      color: #64748b;
      font-weight: 700;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.75);
      padding: 0.4rem 0 0;
      font-weight: 500;
    }

    footer a {
      color: #facc15;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Background Animated Bubbles -->
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>

  <!-- Playful Top Bar -->
  <header class="top-bar">
    <div class="brand-title">
      <span>🎉</span>
      <span>Phonics Fun!</span>
    </div>
    <span class="brand-badge">Kokoro TTS 🎵</span>
  </header>

  <!-- Player Container -->
  <main class="player-container">

    <!-- Stylized Dropdowns -->
    <div class="selectors-row">
      <!-- Letter Select -->
      <div class="select-box" id="letter-select-box">
        <div class="custom-select-trigger" id="letter-trigger">
          <span id="selected-letter-label">A 🍎</span>
          <span class="arrow">▼</span>
        </div>
        <div class="custom-options" id="letter-options"></div>
      </div>

      <!-- Grade Select -->
      <div class="select-box" id="grade-select-box">
        <div class="custom-select-trigger" id="grade-trigger">
          <span id="selected-grade-label">Pre-K 🎈</span>
          <span class="arrow">▼</span>
        </div>
        <div class="custom-options" id="grade-options"></div>
      </div>
    </div>

    <!-- The Single Player Deck Card -->
    <section class="deck-card" id="deck-card">

      <!-- Letter Header Row -->
      <div class="letter-row">
        <div class="letter-display" id="deck-letter" onclick="playCurrentWord()">A</div>
        <div class="letter-info">
          <div class="phonetic-tag" id="deck-phonetic">/eɪ/ or /æ/</div>
          <div class="meta-pills">
            <span class="meta-pill" id="deck-pos">Noun</span>
            <span class="meta-pill grade-badge-glow" id="deck-grade">Pre-K</span>
          </div>
        </div>
      </div>

      <!-- Word Title -->
      <div class="word-title" id="deck-word" onclick="playCurrentWord()">Ant</div>

      <!-- Contextual Sentence Box -->
      <div class="sentence-card" onclick="playCurrentSentence()">
        <div class="sentence-card-label">
          <span>📖</span>
          <span>Read & Listen</span>
        </div>
        <div class="sentence-card-text" id="deck-sentence">"A tiny ant crawls on the leaf."</div>
      </div>

      <!-- Waveform Animation -->
      <div class="waveform-bar" id="waveform">
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
        <div class="wave-stick"></div>
      </div>

      <!-- Chunky Action Buttons -->
      <div class="player-controls">
        <button class="action-btn btn-word" id="play-word-btn" onclick="playCurrentWord()">
          <span id="word-btn-icon">🔊</span>
          <span id="word-btn-label">Say Word</span>
        </button>
        <button class="action-btn btn-sent" id="play-sentence-btn" onclick="playCurrentSentence()">
          <span id="sent-btn-icon">🎧</span>
          <span id="sent-btn-label">Sentence</span>
        </button>
      </div>

      <!-- Bottom Nav Controls -->
      <div class="deck-nav-bar">
        <button class="nav-arrow-btn" id="prev-btn" onclick="navAlphabet(-1)">
          <span>👈</span> Prev
        </button>
        <span class="index-indicator" id="index-indicator">Letter 1 of 26</span>
        <button class="nav-arrow-btn" id="next-btn" onclick="navAlphabet(1)">
          Next <span>👉</span>
        </button>
      </div>
    </section>

  </main>

  <footer>
    <p>Powered by <a href="https://github.com/hexgrad/kokoro" target="_blank">Kokoro TTS</a> | Phonics Audio Explorer</p>
  </footer>

  <script>
    const GRADES = [
      { id: "Pre-K", label: "Pre-K 🎈 (Ages 3-4)" },
      { id: "Kindergarten", label: "Kindergarten 🎨 (Ages 5-6)" },
      { id: "Grade 1", label: "Grade 1 🚀 (Ages 6-7)" },
      { id: "Grade 2", label: "Grade 2 🌟 (Ages 7-8)" },
      { id: "Grade 3", label: "Grade 3 🐬 (Ages 8-9)" },
      { id: "Grade 4", label: "Grade 4 🔬 (Ages 9-10)" },
      { id: "Grade 5", label: "Grade 5 🏆 (Ages 10-11)" }
    ];

    let corpusData = [];
    let currentLetterIndex = 0;
    let selectedGradeId = "Pre-K";
    let currentAudio = null;
    let activePlayingType = null;

    async function init() {
      try {
        const resp = await fetch('data/corpus.json');
        corpusData = await resp.json();
        setupDropdowns();
        setupGestures();
        updateDeck();
      } catch (e) {
        console.error("Failed to load corpus data:", e);
      }
    }

    function setupDropdowns() {
      // 1. Letters Dropdown
      const letterOpts = document.getElementById('letter-options');
      letterOpts.innerHTML = '';
      corpusData.forEach((item, idx) => {
        const opt = document.createElement('div');
        opt.className = `custom-option ${idx === currentLetterIndex ? 'selected' : ''}`;
        opt.dataset.index = idx;
        opt.textContent = `${item.letter} — ${item.words[0]?.word || ''}`;
        opt.onclick = () => {
          currentLetterIndex = idx;
          closeAllDropdowns();
          updateDeck();
          highlightSelectedOption('letter-options', idx);
        };
        letterOpts.appendChild(opt);
      });

      // 2. Grades Dropdown
      const gradeOpts = document.getElementById('grade-options');
      gradeOpts.innerHTML = '';
      GRADES.forEach(g => {
        const opt = document.createElement('div');
        opt.className = `custom-option ${g.id === selectedGradeId ? 'selected' : ''}`;
        opt.dataset.grade = g.id;
        opt.textContent = g.label;
        opt.onclick = () => {
          selectedGradeId = g.id;
          closeAllDropdowns();
          updateDeck();
          highlightSelectedOption('grade-options', g.id);
        };
        gradeOpts.appendChild(opt);
      });

      const letterTrigger = document.getElementById('letter-trigger');
      const gradeTrigger = document.getElementById('grade-trigger');

      letterTrigger.onclick = (e) => {
        e.stopPropagation();
        const isOpen = letterOpts.classList.contains('show');
        closeAllDropdowns();
        if (!isOpen) {
          letterOpts.classList.add('show');
          letterTrigger.classList.add('active');
        }
      };

      gradeTrigger.onclick = (e) => {
        e.stopPropagation();
        const isOpen = gradeOpts.classList.contains('show');
        closeAllDropdowns();
        if (!isOpen) {
          gradeOpts.classList.add('show');
          gradeTrigger.classList.add('active');
        }
      };

      document.addEventListener('click', closeAllDropdowns);
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.custom-options').forEach(o => o.classList.remove('show'));
      document.querySelectorAll('.custom-select-trigger').forEach(t => t.classList.remove('active'));
    }

    function highlightSelectedOption(containerId, value) {
      const container = document.getElementById(containerId);
      container.querySelectorAll('.custom-option').forEach(opt => {
        if (opt.dataset.index == value || opt.dataset.grade == value) {
          opt.classList.add('selected');
        } else {
          opt.classList.remove('selected');
        }
      });
    }

    function getCurrentEntry() {
      if (!corpusData.length) return null;
      const letterData = corpusData[currentLetterIndex];
      if (!letterData) return null;

      let wordEntry = (letterData.words || []).find(w => w.grade === selectedGradeId);
      if (!wordEntry && letterData.words.length) {
        wordEntry = letterData.words[0];
      }

      return {
        letter: letterData.letter,
        phonetic: letterData.phonetic_hint || '',
        word: wordEntry ? wordEntry.word : '',
        pos: wordEntry ? (wordEntry.part_of_speech || 'noun') : '',
        grade: wordEntry ? wordEntry.grade : selectedGradeId,
        wordAudio: wordEntry ? wordEntry.audio_path : '',
        sentence: wordEntry?.sentences?.[0]?.sentence || '',
        sentAudio: wordEntry?.sentences?.[0]?.audio_path || ''
      };
    }

    function updateDeck() {
      stopAudio();
      const entry = getCurrentEntry();
      if (!entry) return;

      document.getElementById('deck-letter').textContent = entry.letter;
      document.getElementById('selected-letter-label').textContent = `${entry.letter} 🔤`;
      document.getElementById('deck-phonetic').textContent = entry.phonetic;
      document.getElementById('deck-word').textContent = entry.word;
      document.getElementById('deck-pos').textContent = entry.pos;
      document.getElementById('deck-grade').textContent = entry.grade;
      document.getElementById('selected-grade-label').textContent = entry.grade;
      document.getElementById('deck-sentence').textContent = `"${entry.sentence}"`;

      document.getElementById('index-indicator').textContent = `${entry.letter} (${currentLetterIndex + 1}/26)`;
      document.getElementById('prev-btn').disabled = (currentLetterIndex === 0);
      document.getElementById('next-btn').disabled = (currentLetterIndex === corpusData.length - 1);

      highlightSelectedOption('letter-options', currentLetterIndex);
      highlightSelectedOption('grade-options', selectedGradeId);

      // Bounce animation on card change
      const card = document.getElementById('deck-card');
      card.style.transform = 'scale(0.97)';
      setTimeout(() => { card.style.transform = 'scale(1)'; }, 100);
    }

    function navAlphabet(delta) {
      const newIdx = currentLetterIndex + delta;
      if (newIdx >= 0 && newIdx < corpusData.length) {
        currentLetterIndex = newIdx;
        updateDeck();
      }
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      activePlayingType = null;
      document.getElementById('waveform').classList.remove('active');

      const wordBtn = document.getElementById('play-word-btn');
      wordBtn.classList.remove('playing');
      document.getElementById('word-btn-icon').textContent = '🔊';
      document.getElementById('word-btn-label').textContent = 'Say Word';

      const sentBtn = document.getElementById('play-sentence-btn');
      sentBtn.classList.remove('playing');
      document.getElementById('sent-btn-icon').textContent = '🎧';
      document.getElementById('sent-btn-label').textContent = 'Sentence';
    }

    function playAudio(path, type) {
      if (activePlayingType === type && currentAudio && !currentAudio.paused) {
        stopAudio();
        return;
      }

      stopAudio();

      activePlayingType = type;
      currentAudio = new Audio(path);
      document.getElementById('waveform').classList.add('active');

      if (type === 'word') {
        const btn = document.getElementById('play-word-btn');
        btn.classList.add('playing');
        document.getElementById('word-btn-icon').textContent = '⏹';
        document.getElementById('word-btn-label').textContent = 'Stop';
      } else {
        const btn = document.getElementById('play-sentence-btn');
        btn.classList.add('playing');
        document.getElementById('sent-btn-icon').textContent = '⏹';
        document.getElementById('sent-btn-label').textContent = 'Stop';
      }

      currentAudio.play().catch(e => {
        console.error("Audio error:", e);
        stopAudio();
      });

      currentAudio.onended = () => {
        stopAudio();
      };
    }

    function playCurrentWord() {
      const entry = getCurrentEntry();
      if (entry?.wordAudio) playAudio(entry.wordAudio, 'word');
    }

    function playCurrentSentence() {
      const entry = getCurrentEntry();
      if (entry?.sentAudio) playAudio(entry.sentAudio, 'sentence');
    }

    // Touch Swipe Gestures
    function setupGestures() {
      const card = document.getElementById('deck-card');
      let touchStartX = 0;
      let touchEndX = 0;

      card.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const swipeDistance = touchEndX - touchStartX;
        if (Math.abs(swipeDistance) > 40) {
          if (swipeDistance < 0) navAlphabet(1);
          else navAlphabet(-1);
        }
      }, { passive: true });
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') navAlphabet(-1);
      else if (e.key === 'ArrowRight') navAlphabet(1);
      else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        playCurrentWord();
      }
    });

    init();
  </script>
</body>
</html>
