<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade-Wise Alphabet Phonics & Sentences Explorer (Kokoro TTS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(30, 41, 69, 0.95);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #06b6d4;
      --accent: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --badge-prek: #ec4899;
      --badge-k: #f59e0b;
      --badge-g1: #10b981;
      --badge-g2: #06b6d4;
      --badge-g3: #6366f1;
      --badge-g4: #8b5cf6;
      --badge-g5: #d946ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
      max-width: 960px;
      margin: 0 auto;
    }

    .badge-top {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    /* Grade Selector Pills */
    .grade-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      padding: 0 1.5rem 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .grade-btn {
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .grade-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .grade-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.5);
    }

    /* Alphabet Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem;
      padding: 0 1.5rem 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .alpha-btn {
      width: 2.25rem;
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .alpha-btn:hover, .alpha-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .letter-badge {
      width: 3rem;
      height: 3rem;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .phonetic {
      font-size: 0.85rem;
      color: var(--secondary);
      font-family: monospace;
      background: rgba(6, 182, 212, 0.1);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .word-section {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .word-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .word-text-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .word-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
    }

    .grade-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .tag-Pre-K { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
    .tag-Kindergarten { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .tag-Grade-1 { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .tag-Grade-2 { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); }
    .tag-Grade-3 { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .tag-Grade-4 { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }
    .tag-Grade-5 { background: rgba(217, 70, 239, 0.2); color: #e879f9; border: 1px solid rgba(217, 70, 239, 0.3); }

    .sentence-section {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 8px;
      padding: 0.75rem;
      border-left: 3px solid var(--secondary);
      margin-top: 0.5rem;
    }

    .sentence-text {
      font-size: 0.92rem;
      line-height: 1.5;
      color: #e2e8f0;
      margin-bottom: 0.6rem;
      font-style: italic;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .play-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .play-btn.playing {
      background: var(--accent);
      border-color: var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    footer a {
      color: #a5b4fc;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="badge-top">Graduated Reading Curriculum</div>
    <h1>Grade-Wise Alphabet Phonics Explorer</h1>
    <p class="subtitle">
      Progression from simple early-reader words (Pre-K / Kindergarten CVC & Sight Words) through Grade 5 advanced vocabulary with example sentences.
    </p>
  </header>

  <!-- Grade Filter Pills -->
  <nav class="grade-bar" id="grade-filter">
    <button class="grade-btn active" data-grade="ALL">All Grades</button>
    <button class="grade-btn" data-grade="Pre-K">Pre-K (Ages 3-4)</button>
    <button class="grade-btn" data-grade="Kindergarten">Kindergarten (Ages 5-6)</button>
    <button class="grade-btn" data-grade="Grade 1">Grade 1 (Ages 6-7)</button>
    <button class="grade-btn" data-grade="Grade 2">Grade 2 (Ages 7-8)</button>
    <button class="grade-btn" data-grade="Grade 3">Grade 3 (Ages 8-9)</button>
    <button class="grade-btn" data-grade="Grade 4">Grade 4 (Ages 9-10)</button>
    <button class="grade-btn" data-grade="Grade 5">Grade 5 (Ages 10-11)</button>
  </nav>

  <!-- Alphabet Filter Bar -->
  <nav class="filter-bar" id="alpha-filter">
    <button class="alpha-btn active" data-letter="ALL">ALL</button>
  </nav>

  <main>
    <div class="cards-grid" id="grid">
      <!-- Cards rendered via JS -->
    </div>
  </main>

  <footer>
    <p>Powered by <a href="https://github.com/hexgrad/kokoro" target="_blank">Kokoro TTS</a> | Open Source Phonics Dataset</p>
  </footer>

  <script>
    let currentAudio = null;
    let activeBtn = null;
    let corpusData = [];
    let selectedLetter = 'ALL';
    let selectedGrade = 'ALL';

    async function loadCorpus() {
      try {
        const response = await fetch('data/corpus.json');
        corpusData = await response.json();
        buildFilterBar();
        setupGradeFilters();
        renderCards();
      } catch (err) {
        console.error("Failed to load corpus.json:", err);
        document.getElementById('grid').innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #f87171;">
            Failed to load dataset: ${err.message}
          </div>
        `;
      }
    }

    function setupGradeFilters() {
      document.querySelectorAll('.grade-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedGrade = btn.dataset.grade;
          renderCards();
        });
      });
    }

    function buildFilterBar() {
      const filterBar = document.getElementById('alpha-filter');
      corpusData.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'alpha-btn';
        btn.dataset.letter = item.letter;
        btn.textContent = item.letter;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedLetter = item.letter;
          renderCards();
        });
        filterBar.appendChild(btn);
      });

      document.querySelector('.alpha-btn[data-letter="ALL"]').addEventListener('click', (e) => {
        document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedLetter = 'ALL';
        renderCards();
      });
    }

    function playAudio(path, btn) {
      if (currentAudio) {
        currentAudio.pause();
        if (activeBtn) {
          activeBtn.classList.remove('playing');
          activeBtn.innerHTML = activeBtn.dataset.originalHtml;
        }
      }

      if (btn === activeBtn && !currentAudio.paused) {
        currentAudio = null;
        activeBtn = null;
        return;
      }

      const audio = new Audio(path);
      currentAudio = audio;
      activeBtn = btn;
      btn.dataset.originalHtml = btn.innerHTML;
      btn.classList.add('playing');
      btn.innerHTML = `<span>⏹ Stop</span>`;

      audio.play().catch(e => {
        btn.classList.remove('playing');
        btn.innerHTML = btn.dataset.originalHtml;
        alert("Audio file queued for Kokoro generation: " + path);
      });

      audio.onended = () => {
        btn.classList.remove('playing');
        btn.innerHTML = btn.dataset.originalHtml;
        currentAudio = null;
        activeBtn = null;
      };
    }

    function renderCards() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const filteredLetters = selectedLetter === 'ALL' 
        ? corpusData 
        : corpusData.filter(d => d.letter === selectedLetter);

      filteredLetters.forEach(item => {
        let matchingWords = item.words || [];
        if (selectedGrade !== 'ALL') {
          matchingWords = matchingWords.filter(w => w.grade === selectedGrade);
        }

        if (matchingWords.length === 0) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${item.letter}`;

        let wordsHtml = '';
        matchingWords.forEach(w => {
          let sentencesHtml = '';
          (w.sentences || []).forEach(s => {
            sentencesHtml += `
              <div class="sentence-section">
                <div class="sentence-text">"${s.sentence}"</div>
                <button class="play-btn" onclick="playAudio('${s.audio_path}', this)">
                  <span>▶ Sentence</span>
                </button>
              </div>
            `;
          });

          const tagClass = 'tag-' + (w.grade || '').replace(/\s+/g, '-');
          wordsHtml += `
            <div class="word-section">
              <div class="word-title-row">
                <div class="word-text-wrapper">
                  <span class="word-text">${w.word}</span>
                  <span class="grade-tag ${tagClass}">${w.grade}</span>
                </div>
                <button class="play-btn" onclick="playAudio('${w.audio_path}', this)">
                  <span>▶ Word</span>
                </button>
              </div>
              ${sentencesHtml}
            </div>
          `;
        });

        card.innerHTML = `
          <div class="card-header">
            <div class="letter-badge">${item.letter}</div>
            <div class="phonetic">${item.phonetic_hint || ''}</div>
          </div>
          ${wordsHtml}
        `;
        grid.appendChild(card);
      });
    }

    loadCorpus();
  </script>
</body>
</html>
